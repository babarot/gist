version: 2

before:
  hooks:
  - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/babarot/gist/v2/internal/version.Source=release
    flags:
      - -trimpath
    main: .

archives:
  - formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: ["zip"]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---
    Generated by [GoReleaser](https://github.com/goreleaser/goreleaser).

brews:
  - repository:
      owner: babarot
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/babarot/gist
    description: Read and edit your GitHub Gists from the terminal
    license: MIT

nix:
  - repository:
      owner: babarot
      name: nur-packages
      token: "{{ .Env.NUR_GITHUB_TOKEN }}"
    homepage: https://github.com/babarot/gist
    description: Read and edit your GitHub Gists from the terminal
    license: mit
    main_program: gist
