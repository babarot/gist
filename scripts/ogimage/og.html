<!DOCTYPE html>
<!--
  The share images of the page (og:image), 1200x630: its moon and probe, drawn
  by docs/space.js, under its words. scripts/ogimage.sh takes a screenshot of
  each theme into docs/ogimage/THEME.png. ?v= picks the theme: dark or light.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>gist og:image</title>
<style>
@font-face { font-family: "Redaction 70"; font-weight: 700; src: url(../../docs/fonts/redaction-70-700.woff2); }
@font-face { font-family: "Departure Mono"; src: url(../../docs/fonts/departure-mono-400.woff2); }
:root { --bg: #05060c; --word: #e6e8f2; --dim: #a4a7b8; }
:root[data-theme="light"] { --bg: #eff1f5; --word: #05060c; --dim: #4c4f69; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
#field { position: fixed; inset: 0; width: 1200px; height: 630px; }
[data-theme="light"] #field { filter: invert(1); }
header { position: relative; padding: 44px 64px; color: var(--word); }
h1 { margin: 0; font: 700 236px/0.82 "Redaction 70", Georgia, serif; letter-spacing: -0.01em; }
p { width: max-content; margin: 22px 0 10px; font: 700 29px/1.3 "Redaction 70", Georgia, serif; }
nav { width: max-content; color: var(--dim); font: 22px "Departure Mono", ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<canvas id="field"></canvas>
<header>
  <h1>gist</h1>
  <p>Read and edit your GitHub Gists from the terminal.</p>
  <nav>babarot.me/gist</nav>
</header>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('v') || 'dark';</script>
<script src="../../docs/space.js"></script>
</body>
</html>
